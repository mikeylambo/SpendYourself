name: CI
on:
  push:
  pull_request:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm run build
      # Balance gate (slifer-tuning.md §9): fails the build when a bot's win rate leaves its band,
      # a run gets stuck, or one enemy causes too many deaths. Bands live in tools/sim.ts.
      - run: npm run sim -- --runs 200 --ci --out sim-report.json
      - uses: actions/upload-artifact@v4
        with:
          name: sim-report
          path: sim-report.json
